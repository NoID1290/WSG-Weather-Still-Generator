<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  WSG Mobile splash screen.
  Uses only <path>, <circle>, <rect> — no <text> — so MAUI/Android
  vector-drawable generation works reliably on all API levels.
  Background colour is set in WSG.Mobile.csproj MauiSplashScreen Color="#2563EB".
-->
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.1"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <!-- ── Radar ring set (centred on 256,210) ─────────────────────────── -->
  <circle cx="256" cy="210" r="140" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="210" r="100" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="210" r="60"  fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.50"/>
  <circle cx="256" cy="210" r="22"  fill="#FFFFFF" opacity="0.90"/>

  <!-- ── Radar sweep arm ─────────────────────────────────────────────── -->
  <!-- Line from centre to upper-right at ~45° -->
  <line x1="256" y1="210" x2="354" y2="112"
        stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.80"/>

  <!-- ── Cross-hairs ────────────────────────────────────────────────── -->
  <line x1="256" y1="76"  x2="256" y2="104" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.60"/>
  <line x1="256" y1="316" x2="256" y2="344" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.60"/>
  <line x1="122" y1="210" x2="150" y2="210" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.60"/>
  <line x1="362" y1="210" x2="390" y2="210" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.60"/>

  <!-- ── "WSG" logo mark — block lettering built from rectangles ─────── -->
  <!-- W -->
  <rect x="60"  y="370" width="12" height="60" fill="#FFFFFF"/>
  <rect x="84"  y="395" width="12" height="35" fill="#FFFFFF"/>
  <rect x="72"  y="395" width="12" height="12" fill="#FFFFFF"/>
  <rect x="96"  y="370" width="12" height="60" fill="#FFFFFF"/>
  <!-- S -->
  <rect x="120" y="370" width="36" height="12" fill="#FFFFFF"/>
  <rect x="120" y="412" width="36" height="12" fill="#FFFFFF"/>
  <rect x="120" y="370" width="12" height="26" fill="#FFFFFF"/>
  <rect x="144" y="396" width="12" height="34" fill="#FFFFFF"/>
  <rect x="120" y="418" width="36" height="12" fill="#FFFFFF"/>
  <!-- G -->
  <rect x="172" y="370" width="36" height="12" fill="#FFFFFF"/>
  <rect x="172" y="418" width="36" height="12" fill="#FFFFFF"/>
  <rect x="172" y="370" width="12" height="60" fill="#FFFFFF"/>
  <rect x="196" y="394" width="12" height="36" fill="#FFFFFF"/>
  <rect x="196" y="406" width="12" height="12" fill="#FFFFFF"/>

  <!-- ── Thin separator line ─────────────────────────────────────────── -->
  <rect x="60" y="450" width="392" height="2" fill="#FFFFFF" opacity="0.40"/>

  <!-- ── "MOBILE" — thin rectangular bar letters ─────────────────────── -->
  <!-- M -->
  <rect x="60"  y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <rect x="60"  y="462" width="28" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="80"  y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <!-- O -->
  <rect x="98"  y="462" width="24" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="98"  y="494" width="24" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="98"  y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <rect x="114" y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <!-- B -->
  <rect x="134" y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <rect x="134" y="462" width="20" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="134" y="478" width="20" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="134" y="494" width="20" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="150" y="462" width="8"  height="18" fill="#FFFFFF" opacity="0.80"/>
  <rect x="150" y="480" width="8"  height="22" fill="#FFFFFF" opacity="0.80"/>
  <!-- I -->
  <rect x="170" y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <!-- L -->
  <rect x="188" y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <rect x="188" y="494" width="22" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <!-- E -->
  <rect x="222" y="462" width="8"  height="40" fill="#FFFFFF" opacity="0.80"/>
  <rect x="222" y="462" width="22" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="222" y="478" width="18" height="8"  fill="#FFFFFF" opacity="0.80"/>
  <rect x="222" y="494" width="22" height="8"  fill="#FFFFFF" opacity="0.80"/>

</svg>
